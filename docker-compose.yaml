services:
  livekit:
    image: livekit/livekit-server:latest
    container_name: livekit-server
    restart: always

    ports:
      - "7880:7880"
      - "7881:7881"
      - "3478:3478/udp"
      - "50000-50050:50000-50050/udp"

    command: --config /livekit.yaml

    volumes:
      - "C:/livekit.yaml:/livekit.yaml"
